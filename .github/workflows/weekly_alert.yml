name: Weekly Signal Alert

on:
  workflow_dispatch:   # iPhoneのショートカット（GitHub API）や「Run workflow」ボタンから手動実行

permissions:
  contents: write      # J-Quantsで追加取得したデータをコミットするため

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install yfinance pandas numpy requests openpyxl xlrd scipy scikit-learn pyarrow jquants-api-client pdfplumber

      - name: シグナルを計算してDiscordに通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python -u weekly_alert.py

      - name: 保有銘柄・取引履歴・追加取得した決算データをコミット
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data_jq/fin_summary.parquet portfolio.csv trade_history.csv 2>/dev/null || true
          git add data_jq/fin_summary.parquet portfolio.csv || true
          git diff --staged --quiet && echo "変更なし" && exit 0
          git commit -m "週次シグナル: 保有銘柄とデータを更新 $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
