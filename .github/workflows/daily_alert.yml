name: Daily Signal Alert

on:
  workflow_dispatch:   # 手動実行（テスト用）
  # schedule:
    # 日本時間 平日7:00頃（日本市場が開く前、米国市場が閉じた後）= UTC 22:00
    # UTC日曜〜木曜 22:00 が、日本時間の月〜金 7:00に対応
    # - cron: '0 22 * * 0-4'

jobs:
  daily-alert:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install yfinance pandas numpy requests openpyxl xlrd scipy scikit-learn==1.8.0 joblib

      - name: シグナルチェック＆Discord通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python daily_alert.py