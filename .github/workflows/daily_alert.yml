name: Daily Signal Alert

on:
  workflow_dispatch:   # 手動実行（テスト用）
  #schedule:
    # 日本時間 平日16:00頃 = UTC 07:00（cronはUTC基準）
    # 月〜金の場合、UTC 07:00 は 月〜金の日本時間16:00に対応
    #- cron: '0 7 * * 1-5'

jobs:
  daily-alert:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install yfinance pandas numpy requests openpyxl xlrd scipy scikit-learn

      - name: シグナルチェック＆Discord通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python daily_alert.py