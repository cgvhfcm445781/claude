name: Probe JPX Pages (temporary)

on:
  push:
    branches: [analyze-weekly-trend-filter]
    paths: [probe_jpx.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python probe_jpx.py
      - name: 結果をコミット
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -f probe_jpx/report_delist.txt || true
          git diff --staged --quiet && exit 0
          git commit -m "JPX上場廃止ページの確認結果"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
