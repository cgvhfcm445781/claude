name: Fetch Macro Data

on:
  workflow_dispatch:   # GitHubの「Run workflow」ボタンから手動実行
  push:                # 取得スクリプトを変更したときだけ自動実行
    paths:
      - fetch_macro.py
      - .github/workflows/fetch_macro.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install yfinance pandas pyarrow scipy scikit-learn

      - name: 市場指標を取得
        run: |
          set -o pipefail
          python -u fetch_macro.py 2>&1 | tee data/macro_fetch_log.txt

      - name: データをコミット
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/macro_daily.parquet data/macro_fetch_log.txt || true
          git diff --staged --quiet && echo "変更なし" && exit 0
          git commit -m "市場指標データを更新 $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
